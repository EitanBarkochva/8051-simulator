<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8051 Simulator — כניסה</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .login-main { flex: 1; display: grid; place-items: center; padding: 24px; }
    .login-card {
      width: 340px; max-width: 92vw;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 28px;
    }
    .login-card h1 { font-size: 22px; margin-bottom: 4px; text-align: center; }
    .login-card .sub { text-align: center; color: var(--text-dim); font-size: 13px; margin-bottom: 22px; }
    .login-card label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 12px; }
    .login-card input {
      display: block; width: 100%; margin-top: 5px;
      background: #0c1118; color: var(--text); border: 1px solid var(--border);
      border-radius: 7px; padding: 10px; font-size: 14px;
    }
    .login-card input:focus { outline: none; border-color: var(--accent); }
    .actions { display: flex; gap: 8px; margin-top: 18px; }
    .actions button { flex: 1; padding: 10px; }
    .msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
    .msg.err { color: var(--err); }
    .msg.ok  { color: var(--ok); }
    .mode-note { margin-top: 16px; font-size: 12px; color: var(--text-dim); text-align: center; line-height: 1.5; }
    .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: var(--text-dim); font-size: 12px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .btn-google {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #fff; color: #1f1f1f; border: 1px solid var(--border);
      border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-google:hover { background: #f1f3f4; }
    .btn-google svg { width: 18px; height: 18px; }
  </style>
  <script src="../js/ui/theme.js"></script>
</head>
<body>
  <script src="../js/ui/nav.js"></script>
  <main class="login-main">
  <div class="login-card">
    <h1>⚡ 8051 Simulator</h1>
    <div class="sub">סביבת לימוד למיקרו-בקר 8051</div>

    <label>שם מלא <small style="color:var(--text-dim)">(להרשמה)</small>
      <input type="text" id="full-name" autocomplete="name" placeholder="ישראל ישראלי">
    </label>
    <label>אימייל
      <input type="email" id="email" autocomplete="email" placeholder="name@example.com">
    </label>
    <label>סיסמה
      <input type="password" id="password" autocomplete="current-password" placeholder="לפחות 6 תווים">
    </label>

    <div class="actions">
      <button class="primary" id="btn-login">כניסה</button>
      <button id="btn-signup">הרשמה</button>
    </div>

    <div class="divider">או</div>
    <button class="btn-google" id="btn-google">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      המשך עם Google
    </button>

    <div class="msg" id="msg"></div>
    <div class="mode-note" id="mode-note"></div>
  </div>
  </main>

  <!-- Supabase SDK (CDN) → config → db → auth -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/db/config.js"></script>
  <script src="../js/db/db.js"></script>
  <script src="../js/db/auth.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const msg = $("msg");
      const show = (text, cls) => { msg.textContent = text; msg.className = "msg " + (cls || ""); };

      // מצב מקומי — אין צורך בכניסה אמיתית; הסתר כניסת Google (דורשת Supabase)
      if (!DB.isSupabase) {
        $("mode-note").innerHTML = "מצב מקומי (localStorage) — הכניסה תיכנס ישירות.<br>הגדר את <code>js/db/config.js</code> כדי לחבר Supabase.";
        $("btn-google").style.display = "none";
        document.querySelector(".divider").style.display = "none";
      } else {
        // טיפול בחזרה מ-OAuth של Google + מצב מחובר קיים
        DB.client.auth.onAuthStateChange((event, session) => {
          if (session) location.href = "dashboard.html";
        });
      }

      // אם כבר מחובר — קדימה לדשבורד
      Auth.getUser().then((u) => { if (u && DB.isSupabase) location.href = "dashboard.html"; });

      async function go(kind) {
        const email = $("email").value.trim();
        const password = $("password").value;
        if (!DB.isSupabase) { location.href = "dashboard.html"; return; }
        if (!email || !password) { show("מלא אימייל וסיסמה", "err"); return; }
        const fullName = $("full-name").value.trim();
        if (kind === "signup" && !fullName) { show("מלא שם מלא להרשמה", "err"); return; }
        show("רגע…");
        const res = kind === "signup" ? await Auth.signUp(email, password, fullName) : await Auth.signIn(email, password);
        if (res.error) { show(res.error, "err"); return; }
        if (res.needsConfirm) { show("נשלח אליך מייל אימות — אשר אותו ואז היכנס.", "ok"); return; }
        location.href = "dashboard.html";
      }

      $("btn-login").addEventListener("click", () => go("login"));
      $("btn-signup").addEventListener("click", () => go("signup"));
      $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") go("login"); });

      $("btn-google").addEventListener("click", async () => {
        show("מעביר ל-Google…");
        const res = await Auth.signInWithGoogle();
        if (res && res.error) show(res.error, "err");   // למשל אם ה-provider לא הופעל ב-Supabase
      });
    })();
  </script>
</body>
</html>
